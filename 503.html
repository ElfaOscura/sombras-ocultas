<!doctype html>
<html lang="es">
  <head>
    <!--@include partials/head.html-->
    <title>Error 503 · Servicio no disponible · Sombras Ocultas</title>
    <meta name="robots" content="noindex" />
  </head>

  <body class="main-bg-image min-h-screen text-plata-200 antialiased">
    <!--@include partials/transicion.html-->

    <!-- Polvo gris -->
    <div id="particulas" class="pointer-events-none fixed inset-0 z-90"></div>

    <!-- Vista de error: sin header ni menú -->
    <main id="contenido" class="relative z-8">
      <section
        class="relative flex min-h-[85dvh] w-full items-center border-b border-plata-400/25"
        style="background: radial-gradient(ellipse 60% 80% at 50% 40%, rgb(37 99 235 / 0.25), transparent 70%), linear-gradient(180deg, rgb(5 10 23 / 0.9), rgb(0 0 0 / 0.8));"
        data-reveal
      >
        <!-- Para poner la imagen a la derecha: añade "md:order-2" a la figura y "md:order-1" al div de texto -->
        <div class="mx-auto grid w-full max-w-5xl items-center gap-10 px-4 py-16 md:grid-cols-2 md:gap-16 md:py-24">
          <!-- Imagen (sin borde). Cambia el src por tu imagen en public/images/errores/ -->
          <figure class="mx-auto w-full max-w-sm md:max-w-none">
            <div class="relative aspect-square w-full">
              <img src="/images/isotipo.svg" alt="" class="absolute left-1/2 top-1/2 size-1/3 -translate-x-1/2 -translate-y-1/2 opacity-25" />
              <img src="/images/errores/503.webp" alt="" class="absolute inset-0 size-full object-contain drop-shadow-[0_0_40px_rgb(37_99_235/0.35)]" onerror="this.remove()" />
            </div>
          </figure>

          <!-- Título del error + botones -->
          <div class="text-center md:text-left">
            <p class="subtitulo text-xs">Error 503</p>
            <h1 class="font-titulo titulo-plata mt-3 text-4xl font-bold leading-tight md:text-6xl">Servicio no disponible</h1>
            <div class="mt-10 flex flex-wrap justify-center gap-4 md:justify-start">
              <a href="/sombras-ocultas/" class="boton">
                <iconify-icon icon="lucide:house" width="16" height="16" aria-hidden="true"></iconify-icon>
                Volver al inicio
              </a>
              <button type="button" class="boton" onclick="window.location.reload()">
                <iconify-icon icon="lucide:rotate-cw" width="16" height="16" aria-hidden="true"></iconify-icon>
                Reintentar
              </button>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!--@include partials/footer.html-->

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
