<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#050a17" />
<link rel="icon" href="/sombras-ocultas/images/isotipo.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Merienda:wght@400;700&family=Noto+Sans:wght@400;500;700&display=swap"
  rel="stylesheet"
/>
<link rel="stylesheet" href="/sombras-ocultas/assets/style.css">

    <title>Error 404 · Página no encontrada · Sombras Ocultas</title>
    <meta name="robots" content="noindex" />
    <script type="module" crossorigin src="/sombras-ocultas/assets/main.js"></script>
    <link rel="stylesheet" crossorigin href="/sombras-ocultas/assets/style.css">
  </head>

  <body class="main-bg-image min-h-screen text-plata-200 antialiased">
    <!-- Vista de carga / transición entre páginas. -->
<div
  id="transicion-pagina"
  class="transicion-pagina"
  role="status"
  aria-live="polite"
  style="position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050a17"
>
  <div class="transicion-sello" data-transicion-logo aria-hidden="true">
    <span class="transicion-anillo"></span>
    <span class="transicion-anillo transicion-anillo-inverso"></span>
    <img src="/sombras-ocultas/images/isotipo.svg" alt="" class="transicion-isotipo" />
  </div>
  <p class="font-titulo titulo-plata mt-8 text-2xl font-bold md:text-3xl" aria-hidden="true">Sombras Ocultas</p>
  <span class="transicion-barra" aria-hidden="true"></span>
  <span class="sr-only">Cargando…</span>
</div>
<noscript><style>#transicion-pagina{display:none!important}</style></noscript>

    <!-- Polvo gris -->
    <div id="particulas" class="pointer-events-none fixed inset-0 z-90"></div>

    <!-- Vista de error: sin header ni menú -->
    <main id="contenido" class="relative z-8">
      <section
        class="relative flex min-h-[85dvh] w-full items-center border-b border-plata-400/25"
        style="background: radial-gradient(ellipse 60% 80% at 50% 40%, rgb(37 99 235 / 0.25), transparent 70%), linear-gradient(180deg, rgb(5 10 23 / 0.9), rgb(0 0 0 / 0.8));"
        data-reveal
      >
        <!-- Para poner el número a la derecha: añade "md:order-2" al div del número y "md:order-1" al div de texto -->
        <div class="mx-auto grid w-full max-w-5xl items-center gap-10 px-4 py-16 md:grid-cols-2 md:gap-16 md:py-24">
          <!-- Número del error: grande y casi oculto (decorativo) -->
          <div class="relative flex items-center justify-center" aria-hidden="true">
            <span class="font-titulo titulo-plata select-none text-[9rem] font-bold leading-none opacity-20 [mask-image:linear-gradient(to_bottom,black_35%,transparent_95%)] md:text-[15rem]">404</span>
          </div>

          <!-- Título del error + botones -->
          <div class="text-center md:text-left">
            <p class="subtitulo text-xs">Error 404</p>
            <h1 class="font-titulo titulo-plata mt-3 text-4xl font-bold leading-tight md:text-6xl">Página no encontrada</h1>
            <div class="mt-10 flex flex-wrap justify-center gap-4 md:justify-start">
              <a href="/sombras-ocultas/" class="boton">
                <iconify-icon icon="lucide:house" width="16" height="16" aria-hidden="true"></iconify-icon>
                Volver al inicio
              </a>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="relative z-10 border-t border-plata-400/25 bg-linear-to-b from-noche-950/90 to-noche-950 px-4 pb-5 pt-9 text-center shadow-[0_-20px_40px_rgb(0_0_0/0.45)] backdrop-blur-sm">
  <!-- Remates en los extremos de la línea -->
  <span class="adorno-extremo left-3 -scale-x-100" aria-hidden="true"></span>
  <span class="adorno-extremo right-3" aria-hidden="true"></span>

  <p class="font-titulo text-lg titulo-plata">Sombras Ocultas</p>
  <p class="subtitulo mt-1 text-[0.65rem] md:text-xs">Uduné · Donde las nieblas guardan la verdad del corazón</p>
  <p class="mt-2 text-xs text-plata-500">
    Un mundo creado por
    <a href="https://naidiart.com/" class="magic-link text-plata-300 hover:text-white">Naidi_art</a>
    · © <span data-anio>2026</span>
  </p>
  <nav aria-label="Enlaces del pie de página" class="mt-3">
    <a href="/sombras-ocultas/creditos.html" class="boton px-5 py-1.5 text-xs">
      <iconify-icon icon="lucide:heart-handshake" width="14" height="14" aria-hidden="true"></iconify-icon>
      Créditos
    </a>
  </nav>
</footer>

<!-- Botón volver arriba -->
<button type="button" data-volver-arriba aria-label="Volver arriba" class="boton-subir">
  <iconify-icon icon="lucide:chevron-up" width="22" height="22"></iconify-icon>
</button>

  </body>
</html>
