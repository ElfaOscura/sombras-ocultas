<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Símbolo del reino de Archinón: media luna (brillo abajo) + estrella de 5 puntas -->
  <defs>
    <linearGradient id="luna" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f4a86"/>
      <stop offset="0.5" stop-color="#8fb8f5"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <linearGradient id="estrella" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#bcd4fb"/>
    </linearGradient>
    <mask id="hueco">
      <rect width="100" height="100" fill="#fff"/>
      <circle cx="50" cy="38" r="33" fill="#000"/>
    </mask>
  </defs>
  <circle cx="50" cy="52" r="40" fill="url(#luna)" mask="url(#hueco)"/>
  <polygon points="50.00,21.00 53.14,30.67 63.31,30.67 55.09,36.65 58.23,46.33 50.00,40.35 41.77,46.33 44.91,36.65 36.69,30.67 46.86,30.67" fill="url(#estrella)"/>
</svg>
