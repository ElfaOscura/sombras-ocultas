<!-- src/partials/header.html
     Menú de ESCRITORIO para las páginas interiores (md en adelante).
     - NO se incluye en index.html: ahí el menú son los iconos del hero.
     - En móvil lo cubre nav.html (la píldora fija con el botón hamburguesa).
     - La página actual se resalta sola (ver marcarEnlaceActivo() en menu.js). -->
<header
  data-header
  class="sticky top-0 z-50 hidden w-full border-b border-plata-400/20 bg-noche-950/85 shadow-[0_8px_30px_rgb(0_0_0/0.35)] backdrop-blur-md md:block"

  <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-6 py-3">

    <a href="/sombras-ocultas/" aria-label="Sombras Ocultas, ir al inicio" class="group flex shrink-0 items-center gap-3">
      <img src="/images/isotipo.svg" alt="" class="size-8 transition duration-300 group-hover:scale-110" />
      <span class="font-titulo hidden text-lg font-bold tracking-wider text-plata-100 transition group-hover:text-azul-300 lg:inline">
        Sombras Ocultas
      </span>
    </a>

    <nav aria-label="Principal" class="flex items-center gap-4 lg:gap-8">

      <!-- Personajes -->
      <div class="group relative" data-grupo>
        <a
          href="/sombras-ocultas/personajes/"
          class="flex items-center gap-1 py-2 text-sm font-medium text-plata-400 transition hover:text-plata-100 focus-visible:text-plata-100 aria-[current=page]:text-azul-300 data-[actual=true]:text-azul-300"
        >
          Personajes
          <iconify-icon icon="lucide:chevron-down" width="14" height="14" class="transition duration-300 group-hover:rotate-180 group-focus-within:rotate-180"></iconify-icon>
